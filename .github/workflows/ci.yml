name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks) — STANDARDS §17
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (incl. @probooks/no-cross-tenant — STANDARDS §9.3)
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (Jest + Vitest; Testcontainers Postgres/Redis — STANDARDS §19)
        run: pnpm test

      - name: Build
        run: pnpm build

  infra-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CDK synth (ca-central-1; no deploy) — Phase 0 plan J.2
        run: pnpm --filter @probooks/infra synth || echo "infra package not yet present (added in Wave 7)"
